name: Build and Release

on:
  push:
    branches:
      - main
    tags:
      - "[0-9]*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

env:
  DECKY_CLI_VERSION: "0.0.8"
  DECKY_CLI_SHA256: "6777e356508c1ce887f8e61b0fa4954bb48b32e6d97341eef68ea4e0d6ead9a0"
  # Decky's plugin-store builder: Node 26.12.1 and pnpm 12.14.0.
  DECKY_FRONTEND_IMAGE: ghcr.io/steamdeckhomebrew/builder@sha256:e2616e391f3ae9a46c4cf906b1091220c2506e7fb1301e16a2a72409efbce7c5

jobs:
  build:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Validate release version
        run: |
          python3 - <<'PY'
          import json
          import os
          import tomllib
          from pathlib import Path

          version = json.loads(Path("package.json").read_text())["version"]
          backend = tomllib.loads(Path("backend/Cargo.toml").read_text())["package"]
          npm_lock = json.loads(Path("package-lock.json").read_text())
          cargo_lock = tomllib.loads(Path("backend/Cargo.lock").read_text())
          locked_backend = next(package for package in cargo_lock["package"] if package["name"] == backend["name"] and "source" not in package)
          versions = {
              "backend/Cargo.toml": backend["version"],
              "backend/Cargo.lock": locked_backend["version"],
              "package-lock.json": npm_lock["version"],
              "package-lock.json (root package)": npm_lock["packages"][""]["version"],
          }
          for path, actual in versions.items():
              if actual != version:
                  raise SystemExit(f"{path} has version {actual}, expected {version}. Update and commit the manifests and lockfiles together.")
          if os.environ["GITHUB_REF_TYPE"] == "tag" and os.environ["GITHUB_REF_NAME"] != version:
              raise SystemExit(f"Release tag must match package versions: {version}")
          PY

      - name: Install pinned Decky CLI
        run: |
          mkdir -p "$RUNNER_TEMP/decky-cli"
          curl --fail --location --retry 3 \
            "https://github.com/SteamDeckHomebrew/cli/releases/download/$DECKY_CLI_VERSION/decky-linux-x86_64" \
            --output "$RUNNER_TEMP/decky-cli/decky"
          echo "$DECKY_CLI_SHA256  $RUNNER_TEMP/decky-cli/decky" | sha256sum --check
          chmod +x "$RUNNER_TEMP/decky-cli/decky"
          echo "$RUNNER_TEMP/decky-cli" >> "$GITHUB_PATH"

      - name: Pin Decky's frontend builder
        run: |
          docker pull "$DECKY_FRONTEND_IMAGE"
          # CLI 0.0.8 hardcodes this local tag and only pulls it if missing.
          docker tag "$DECKY_FRONTEND_IMAGE" ghcr.io/steamdeckhomebrew/builder:latest

      - name: Check frontend in Decky's builder
        run: |
          docker run --rm --user "$(id -u):$(id -g)" \
            --volume "$PWD:/plugin" --entrypoint sh "$DECKY_FRONTEND_IMAGE" -ec '
            cd /plugin
            pnpm install --frozen-lockfile
            pnpm test
            pnpm lint
            pnpm format:check
          '

      - name: Test backend in Decky's SteamOS toolchain
        run: |
          docker build --file backend/Dockerfile --tag wine-cellar backend
          docker run --rm --user "$(id -u):$(id -g)" \
            --volume "$PWD/backend:/backend" --entrypoint bash wine-cellar -ec '
            cd /backend
            export CARGO_TARGET_DIR=/tmp/wine-cellar-target
            cargo test --locked
          '

      - name: Build plugin with Decky CLI
        # Keep the CLI and both containers under the same UID to avoid root-owned output.
        run: decky plugin build "$PWD"

      - name: Verify package and create checksum
        working-directory: out
        run: |
          python3 - <<'PY'
          import json
          import zipfile
          from pathlib import Path

          name = json.loads(Path("../plugin.json").read_text())["name"]
          with zipfile.ZipFile(f"{name}.zip") as archive:
              if archive.testzip() is not None:
                  raise SystemExit("Corrupt plugin archive")
              for path in ("dist/index.js", "bin/backend", "main.py", "package.json", "plugin.json", "LICENSE"):
                  entry = archive.getinfo(f"{name}/{path}")
                  if entry.file_size == 0:
                      raise SystemExit(f"Empty file in plugin archive: {path}")
              if not (archive.getinfo(f"{name}/bin/backend").external_attr >> 16) & 0o111:
                  raise SystemExit("Packaged backend is not executable")
          PY
          sha256sum -- *.zip > SHA256SUMS

      - name: Upload installable plugin
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: decky-wine-cellar-${{ github.sha }}
          path: |
            out/*.zip
            out/SHA256SUMS
          if-no-files-found: error
          compression-level: 0

  release:
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Download verified plugin
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: decky-wine-cellar-${{ github.sha }}
          path: release

      - name: Publish tagged release
        working-directory: release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          sha256sum --check SHA256SUMS
          options=(--verify-tag --generate-notes --title "$RELEASE_TAG")
          if [[ "${RELEASE_TAG%%+*}" == *-* ]]; then
            options+=(--prerelease)
          fi
          gh release create "$RELEASE_TAG" "${options[@]}" ./*.zip SHA256SUMS
